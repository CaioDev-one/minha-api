name: Pipeline CI/CD - FastAPI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  IMAGE_NAME: caiodevone/minha-api

jobs:

  Testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar testes
        run: python -m pytest tests/ -v

  Build:
    runs-on: ubuntu-latest
    needs: Testes
    if: github.event_name == 'push'

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir imagem
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Publicar imagem
        run: docker push $IMAGE_NAME:${{ github.sha }}

  Deploy_Homologacao:
    runs-on: ubuntu-latest
    needs: Build
    if: github.ref == 'refs/heads/develop'
    environment: HOMOL

    steps:
      - name: Deploy na EC2 de homologação
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}

            docker rm -f api-homol || true

            docker run -d \
              --name api-homol \
              --restart unless-stopped \
              -p 8080:8080 \
              ${{ env.IMAGE_NAME }}:${{ github.sha }}

  Deploy_Producao:
    runs-on: ubuntu-latest
    needs: Build
    if: github.ref == 'refs/heads/main'
    environment: PRD

    steps:
      - name: Deploy na EC2 de produção
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}

            docker rm -f api-prd || true

            docker run -d \
              --name api-prd \
              --restart unless-stopped \
              -p 8080:8080 \
              ${{ env.IMAGE_NAME }}:${{ github.sha }}